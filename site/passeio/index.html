<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clínica Dias por dentro</title>
  <meta name="description" content="Conheça a Clínica Dias por dentro: entre pela portaria, passe pela recepção e chegue aos consultórios.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="../img/favicon-32.png">
  <link rel="preload" href="../fonts/jost-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./passeio.css">
</head>
<body class="carregando">
  <!-- sombra de folhas passando devagar no fundo das maquetes -->
  <div class="folhas" aria-hidden="true">
    <svg viewBox="0 0 600 600" preserveAspectRatio="xMidYMid slice">
      <defs><filter id="desfoca"><feGaussianBlur stdDeviation="14"/></filter></defs>
      <g filter="url(#desfoca)" fill="#6b5a44">
        <path d="M80 520 C 150 420, 260 380, 330 300" stroke="#6b5a44" stroke-width="6" fill="none"/>
        <ellipse cx="150" cy="430" rx="70" ry="22" transform="rotate(-40 150 430)"/>
        <ellipse cx="200" cy="470" rx="64" ry="20" transform="rotate(15 200 470)"/>
        <ellipse cx="225" cy="370" rx="76" ry="23" transform="rotate(-62 225 370)"/>
        <ellipse cx="282" cy="402" rx="66" ry="20" transform="rotate(8 282 402)"/>
        <ellipse cx="300" cy="300" rx="70" ry="21" transform="rotate(-80 300 300)"/>
        <ellipse cx="350" cy="330" rx="60" ry="18" transform="rotate(-10 350 330)"/>
        <ellipse cx="110" cy="500" rx="58" ry="18" transform="rotate(-12 110 500)"/>
      </g>
    </svg>
  </div>
  <img id="maq-img" class="maq-img" alt="" aria-hidden="true">
  <canvas id="cena" aria-label="Clínica Dias em 3D"></canvas>

  <!-- moldura de linhas finas -->
  <div class="moldura" aria-hidden="true"><i class="m-topo"></i><i class="m-esq"></i><i class="m-dir"></i></div>

  <header class="topo">
    <a class="marca" href="../" aria-label="Clínica Dias, ir para o site">
      <img src="../img/simbolo.svg" alt="" height="18">
      <span>Clínica <b>Dias</b></span>
    </a>
    <button class="topo-centro" id="btn-areas-topo" type="button">Por dentro</button>
    <nav class="topo-links">
      <a href="../#especialidades">Especialidades</a>
      <a href="../#unidades">Unidades</a>
      <a href="tel:+553138496156">Agendar</a>
      <button class="som" id="btn-som" type="button" aria-pressed="false" aria-label="Ligar o som">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z" fill="none" stroke="currentColor" stroke-width="1.2"/><path class="onda" d="M11.5 5.5a3.5 3.5 0 0 1 0 5M13.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </nav>
  </header>

  <!-- entrada -->
  <section class="entrada" id="entrada" aria-live="polite">
    <div class="entrada-marca">
      <img class="entrada-logo" src="../img/logo.svg" alt="Clínica Dias — Medicina Especializada" width="320" height="120">
      <p class="entrada-frase">Entre e conheça a clínica por dentro</p>
    </div>
    <div class="entrada-barra" role="progressbar" aria-label="Carregando o passeio"><i id="barra"></i></div>
    <p class="entrada-dica">Role ou arraste para andar · os olhos abrem detalhes</p>
  </section>

  <!-- tela das maquetes -->
  <section class="maquetes" id="maquetes" hidden>
    <!-- setas nas bordas, com o nome da parte vizinha na vertical (como o ICG) -->
    <button class="nav-lado nav-ant" id="seta-esq" type="button">
      <span class="nav-bola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="nav-nome"></span>
    </button>
    <button class="nav-lado nav-prox" id="seta-dir" type="button">
      <span class="nav-nome"></span>
      <span class="nav-bola"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>

    <div class="maquete-rodape">
      <div class="area-titulo" id="area-titulo">
        <p class="area-andar" id="area-andar">Térreo</p>
        <h1 id="area-nome">Recepção 1</h1>
        <p class="area-sub" id="area-sub"></p>
      </div>
      <!-- Entrar com uma seta de cada lado para passar de área (computador e celular) -->
      <div class="entrar-linha">
        <button class="seta-redonda" id="seta-ant2" type="button" aria-label="Área anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn-entrar" id="btn-entrar" type="button">Entrar</button>
        <button class="seta-redonda" id="seta-prox2" type="button" aria-label="Próxima área"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <ol class="passos" id="passos" aria-label="Partes da clínica"></ol>
    </div>
  </section>

  <!-- passeio por dentro -->
  <section class="dentro" id="dentro" hidden>
    <div class="pontos" id="pontos"></div>
    <div class="dica" id="dica" role="dialog" aria-label="Como andar">
      <div class="dica-topo"><span>Como andar</span><button type="button" id="dica-fechar" aria-label="Fechar">×</button></div>
      <div class="dica-desenho" aria-hidden="true"><i></i><i></i><i class="ativo"></i><i class="ativo"></i><i></i><i></i></div>
      <p>Role ou arraste para andar</p>
    </div>
    <button class="btn-areas" id="btn-areas" type="button">
      Áreas
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 2 14 5 8 8 2 5z M2 8l6 3 6-3 M2 11l6 3 6-3" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
    </button>
    <div class="progresso" aria-hidden="true"><i id="progresso"></i></div>
  </section>

  <aside class="painel" id="painel" hidden>
    <button class="painel-fechar" id="painel-fechar" type="button" aria-label="Fechar">×</button>
    <h2 id="painel-titulo"></h2>
    <p class="painel-sub" id="painel-sub"></p>
    <video id="painel-video" class="painel-video" muted playsinline loop preload="none" hidden></video>
    <p id="painel-texto"></p>
    <div class="painel-acoes">
      <button class="painel-link painel-sala" id="painel-sala" type="button" hidden>Ver por dentro</button>
      <a class="painel-link" id="painel-link" hidden></a>
    </div>
  </aside>

  <div class="veu" id="veu"></div>

  <!-- No GitHub Pages não há Vite: os nomes 'three' e 'gsap' vêm do CDN (no Vite o importmap é ignorado) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.13.0/index.js"
    }
  }
  </script>
  <script type="module" src="./passeio.js"></script>
</body>
</html>
